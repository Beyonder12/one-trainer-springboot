# ===========================================
# ORDER SERVICE
# ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector: #untuk menghubungkan deployment yaml ke pod
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          env:
            - name: ENVIRONMENT
              value: DEVV
          imagePullPolicy: Never
          ports:
            - containerPort: 8081 #port container from dockerfile expose
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
# ===========================================
# PAYMENT SERVICE
# ===========================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector: #untuk menghubungkan deployment yaml ke pod
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-service:latest
          env:
            - name: ENVIRONMENT
              value: DEVV
          imagePullPolicy: Never
          ports:
            - containerPort: 8082 #port container from dockerfile expose
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 8082 #port clusterIP internal
      targetPort: 8082 #pointing to container port
      nodePort: 30082 #exposed