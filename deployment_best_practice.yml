# ===========================================
# GATEWAY SERVICE (EXTERNAL)
# ===========================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_ORDER_URL
              value: "http://order-service:8081"
            - name: SERVICE_PAYMENT_URL
              value: "http://payment-service:8082"
            - name: SERVICE_USER_URL
              value: "http://user-service:8083"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
