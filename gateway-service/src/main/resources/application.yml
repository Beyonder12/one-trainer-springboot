server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/products/**
          filters:
            - LoggingGatewayFilter
            - RewritePath=/products(?<segment>/?.*), /api/products${segment}