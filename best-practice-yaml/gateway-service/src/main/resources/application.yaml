server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:

        # =========================
        # PRODUCT SERVICE
        # =========================

        # GET /api/v1/products  →  /api/v1/product-service/products
        - id: product-service-root
          uri: http://product-service:8081
          predicates:
            - Path=/api/v1/products/**
          filters:
            - RewritePath=/api/v1/products,/api/v1/product-service/products

        # GET /api/v1/products/{id} → /api/v1/product-service/products/{id}
        - id: product-service
          uri: http://product-service:8081
          predicates:
            - Path=/api/v1/products/**
          filters:
            - RewritePath=/api/v1/products/(?<segment>.*),/api/v1/product-service/products/${segment}


        # =========================
        # USER SERVICE
        # =========================

        - id: user-service-root
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users,/api/v1/user-service/users

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users/(?<segment>.*),/api/v1/user-service/users/${segment}


        # =========================
        # ORDER SERVICE
        # =========================

        - id: order-service-root
          uri: http://order-service:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - RewritePath=/api/v1/orders,/api/v1/order-service/orders

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - RewritePath=/api/v1/orders/(?<segment>.*),/api/v1/order-service/orders/${segment}
